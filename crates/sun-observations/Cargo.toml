[package]
name = "sun-observations"
version = "0.2.0"
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "Typed runtime observations, production capture and generic semantic certification"
readme = "README.md"
include = ["Cargo.toml", "README.md", "src/**", "agent-skills/**", "examples/**", "benches/**", "tests/**"]

[dependencies]
sun-observations-derive = { path = "../sun-observations-derive", version = "=0.1.0" }
serde.workspace = true
serde_json.workspace = true
chrono = { version = "0.4", default-features = false, features = ["clock"] }
uuid = { version = "1", features = ["v4"] }
parking_lot = "0.12"
crossbeam-channel = "0.5"
tempfile = "3"
rayon = "1.10"

[[bin]]
name = "cargo-sun-observations-skills"
path = "src/bin/cargo-sun-observations-skills.rs"

[[bench]]
name = "human"
harness = false

[[bench]]
name = "batch"
harness = false

[[bench]]
name = "runtime"
harness = false

[[bench]]
name = "investigation"
harness = false

[[bench]]
name = "investigation_allocations"
harness = false

[[bench]]
name = "analysis"
harness = false

[[bench]]
name = "capture"
harness = false

[[bench]]
name = "certifications"
harness = false

[[bench]]
name = "generative_certifications"
harness = false

[[bench]]
name = "framework_audit"
harness = false

[[test]]
name = "benchmark_reports"
path = "benches/support/report_process.rs"

[dev-dependencies]
trybuild = "1"
# Benchmark-only equivalent-schema raw-payload comparison; no production representation change.
serde_json = { workspace = true, features = ["raw_value"] }
