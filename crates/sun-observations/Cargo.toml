[package]
name = "sun-observations"
version.workspace = true
edition.workspace = true
description = "Typed, scoped runtime observations with lazy admission and namespace routing"

[features]
default = []
rayon = ["dep:rayon"]

[dependencies]
sun-observations-derive = { path = "../sun-observations-derive", version = "0.1.0" }
serde.workspace = true
serde_json.workspace = true
chrono = { version = "0.4", default-features = false, features = ["clock"] }
uuid = { version = "1", features = ["v4"] }
parking_lot = "0.12"
rayon = { version = "1.10", optional = true }

[dev-dependencies]
trybuild = "1"
tempfile = "3"

[[example]]
name = "basic"
path = "../../examples/basic.rs"

[[example]]
name = "scoped"
path = "../../examples/scoped.rs"

[[example]]
name = "channels"
path = "../../examples/channels.rs"
