[package]
name = "sun-observations-certifications"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
publish = false

[[test]]
name = "documentation_certification"
path = "documentation_certification.rs"

[[test]]
name = "analysis_certification"
path = "analysis_certification.rs"

[[test]]
name = "human_delivery_certification"
path = "human_delivery_certification.rs"

[dependencies]
sun-observations = { path = "../crates/sun-observations" }
serde.workspace = true
serde_json.workspace = true
tempfile = "3"
chrono = { version = "0.4", default-features = false, features = ["std"] }
rayon = "1.10"
syn = { version = "2", features = ["full"] }

[[test]]
name = "concurrent_scopes_certification"
path = "concurrent_scopes_certification.rs"
[[test]]
name = "thread_propagation_certification"
path = "thread_propagation_certification.rs"
[[test]]
name = "rayon_propagation_certification"
path = "rayon_propagation_certification.rs"
[[test]]
name = "channel_fanout_certification"
path = "channel_fanout_certification.rs"
[[test]]
name = "jsonl_roundtrip_certification"
path = "jsonl_roundtrip_certification.rs"
[[test]]
name = "runtime_end_to_end_certification"
path = "runtime_end_to_end_certification.rs"
