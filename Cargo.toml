[workspace]
members = ["crates/sun-observations", "crates/sun-observations-derive", "certifications", "crates/sun-observations-data-source", "crates/sun-certifications"]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2021"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.test]
opt-level = 2