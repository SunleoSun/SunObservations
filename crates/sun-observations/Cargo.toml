[package]
name = "sun-observations"
version.workspace = true
edition.workspace = true
description = "Typed, scoped runtime observations with lazy admission and namespace routing"

[features]
default = []
rayon = ["dep:rayon"]

[dependencies]
sun-observations-derive = { path = "../sun-observations-derive", version = "0.1.0" }
serde.workspace = true
serde_json.workspace = true
chrono = { version = "0.4", default-features = false, features = ["clock"] }
uuid = { version = "1", features = ["v4"] }
parking_lot = "0.12"
crossbeam-channel = "0.5"
tempfile = "3"
rayon = { version = "1.10", optional = true }

[[bench]]
name = "batch"
harness = false

[[bench]]
name = "runtime"
harness = false

[[bench]]
name = "investigation"
harness = false

[[bench]]
name = "investigation_allocations"
harness = false

[[test]]
name = "benchmark_reports"
path = "benches/support/report_test.rs"

[dev-dependencies]
trybuild = "1"
# Benchmark-only equivalent-schema raw-payload comparison; no production representation change.
serde_json = { workspace = true, features = ["raw_value"] }

[[example]]
name = "basic"
path = "../../examples/basic.rs"

[[example]]
name = "scoped"
path = "../../examples/scoped.rs"

[[example]]
name = "channels"
path = "../../examples/channels.rs"
